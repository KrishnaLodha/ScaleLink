spring:
  application:
    name: scalink

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scalink}
    username: ${DB_USER:scalink}
    password: ${DB_PASSWORD:scalink}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: scalink

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

scalink:
  base-url: ${SCALELINK_BASE_URL:http://localhost:8080}
  short-code-length: 7
  cache:
    url-ttl-seconds: ${CACHE_URL_TTL_SECONDS:86400}
    analytics-ttl-seconds: ${CACHE_ANALYTICS_TTL_SECONDS:900}
    dashboard-ttl-seconds: ${CACHE_DASHBOARD_TTL_SECONDS:300}
    popular-refresh-ms: 300000
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    anonymous-per-minute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:100}
    authenticated-per-minute: ${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:500}
    window-seconds: 60
  jwt:
    secret: ${JWT_SECRET:scalink-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

resilience4j:
  retry:
    instances:
      analytics:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

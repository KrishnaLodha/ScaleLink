<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleLink — URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info span { color: #a1a1aa; font-size: 14px; }
        .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.1); color: #a1a1aa; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        /* ── Auth Screen ── */
        .auth-screen {
            display: flex; justify-content: center; align-items: center;
            min-height: calc(100vh - 80px); padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px; padding: 40px;
            width: 100%; max-width: 420px;
        }
        .auth-card h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .auth-card p { color: #71717a; font-size: 14px; margin-bottom: 28px; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 28px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 500; background: transparent; border: none; color: #71717a; transition: all 0.2s; }
        .auth-tab.active { background: rgba(99,102,241,0.15); color: #a78bfa; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #a1a1aa; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
            color: #e4e4e7; font-size: 15px; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #6366f1; }
        .btn-primary {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s; margin-top: 8px; font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; text-align: center; }

        /* ── App Screen ── */
        .app-screen { display: none; padding: 40px; max-width: 900px; margin: 0 auto; }

        /* ── Shorten Box ── */
        .shorten-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 32px; margin-bottom: 32px;
        }
        .shorten-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .shorten-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .shorten-row input { flex: 1; }
        .shorten-row input, .alias-row input {
            padding: 12px 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
            color: #e4e4e7; font-size: 15px; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color 0.2s;
        }
        .shorten-row input:focus, .alias-row input:focus { border-color: #6366f1; }
        .alias-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        .alias-row input { flex: 1; }
        .alias-row span { color: #71717a; font-size: 13px; white-space: nowrap; }
        .btn-shorten {
            padding: 12px 28px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s; font-family: 'Inter', sans-serif;
        }
        .btn-shorten:hover { opacity: 0.9; }

        /* ── Result ── */
        .result-box {
            display: none; margin-top: 20px; padding: 16px 20px;
            background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
            border-radius: 12px;
        }
        .result-box .label { font-size: 12px; color: #a78bfa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .result-link { display: flex; align-items: center; gap: 12px; }
        .result-link a { color: #c4b5fd; font-size: 18px; font-weight: 600; text-decoration: none; word-break: break-all; }
        .result-link a:hover { text-decoration: underline; }
        .btn-copy {
            padding: 8px 16px; border: 1px solid rgba(99,102,241,0.3); border-radius: 8px;
            background: transparent; color: #a78bfa; font-size: 13px; cursor: pointer;
            white-space: nowrap; transition: all 0.2s; font-family: 'Inter', sans-serif;
        }
        .btn-copy:hover { background: rgba(99,102,241,0.15); }

        /* ── Links List ── */
        .links-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .links-list { display: flex; flex-direction: column; gap: 12px; }
        .link-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 20px; transition: border-color 0.2s;
        }
        .link-card:hover { border-color: rgba(99,102,241,0.3); }
        .link-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .link-short { color: #a78bfa; font-weight: 600; font-size: 16px; text-decoration: none; }
        .link-short:hover { text-decoration: underline; }
        .link-clicks { color: #71717a; font-size: 13px; }
        .link-clicks strong { color: #e4e4e7; }
        .link-original { color: #71717a; font-size: 14px; word-break: break-all; }
        .empty-state { text-align: center; padding: 60px 20px; color: #52525b; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #18181b; border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px; border-radius: 12px; font-size: 14px;
            transition: transform 0.3s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            header { padding: 16px 20px; }
            .app-screen { padding: 20px; }
            .shorten-row { flex-direction: column; }
            .alias-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">⚡ ScaleLink</div>
    <div class="user-info" id="userInfo" style="display:none">
        <span id="usernameDisplay"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</header>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2>Welcome to ScaleLink</h2>
        <p>Shorten any URL in seconds</p>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Login</button>
            <button class="auth-tab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="loginUser" placeholder="Enter username or email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <div class="error-msg" id="loginError"></div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUser" placeholder="Choose a username" required minlength="3">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="Min 8 characters" required minlength="8">
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
            <div class="error-msg" id="regError"></div>
        </form>

        <div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.06);">
            <div class="form-group" style="margin-bottom:0">
                <label style="font-size:11px; color:#71717a">Backend Server URL:</label>
                <input type="url" id="apiUrlInput" style="font-size:12px; padding:6px 10px;" placeholder="e.g. https://scalelink-1.onrender.com" onchange="updateApiUrl(this.value)">
            </div>
        </div>
    </div>
</div>

<!-- App Screen -->
<div class="app-screen" id="appScreen">
    <!-- Shorten URL -->
    <div class="shorten-box">
        <h2>🔗 Shorten a URL</h2>
        <div class="shorten-row">
            <input type="url" id="urlInput" placeholder="Paste your long URL here..." required>
        </div>
        <div class="alias-row">
            <span>Custom alias (optional):</span>
            <input type="text" id="aliasInput" placeholder="e.g. my-link" minlength="3">
            <button class="btn-shorten" onclick="shortenUrl()">Shorten</button>
        </div>
        <div class="error-msg" id="shortenError"></div>

        <div class="result-box" id="resultBox">
            <div class="label">Your short link</div>
            <div class="result-link">
                <a id="resultLink" href="#" target="_blank"></a>
                <button class="btn-copy" onclick="copyLink()">Copy</button>
            </div>
        </div>
    </div>

    <!-- My Links -->
    <div class="links-section">
        <h2>📋 Your Links</h2>
        <div class="links-list" id="linksList">
            <div class="empty-state">
                <div class="icon">🔗</div>
                <p>No links yet. Shorten your first URL above!</p>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let API = localStorage.getItem('sl_api_url') || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:8080' : 'https://scalelink-1.onrender.com');
let token = localStorage.getItem('sl_token');
let username = localStorage.getItem('sl_username');

document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('apiUrlInput');
    if (input) input.value = API;
});

function updateApiUrl(val) {
    if (!val) return;
    val = val.replace(/\/+$/, '');
    localStorage.setItem('sl_api_url', val);
    API = val;
    showToast('Backend URL updated! ⚙️');
}

// Check if already logged in
if (token) showApp();

function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const err = document.getElementById('loginError');
    err.textContent = '';
    try {
        const res = await fetch(`${API}/api/v1/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                usernameOrEmail: document.getElementById('loginUser').value,
                password: document.getElementById('loginPass').value
            })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');
        saveAuth(data);
    } catch (e) { err.textContent = e.message; }
}

async function handleRegister(e) {
    e.preventDefault();
    const err = document.getElementById('regError');
    err.textContent = '';
    try {
        const res = await fetch(`${API}/api/v1/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('regUser').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value
            })
        });
        const data = await res.json();
        if (!res.ok) {
            if (data.validationErrors) throw new Error(Object.values(data.validationErrors).join(', '));
            throw new Error(data.message || 'Registration failed');
        }
        saveAuth(data);
    } catch (e) { err.textContent = e.message; }
}

function saveAuth(data) {
    token = data.accessToken;
    username = data.user.username;
    localStorage.setItem('sl_token', token);
    localStorage.setItem('sl_username', username);
    showApp();
}

function showApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('userInfo').style.display = 'flex';
    document.getElementById('usernameDisplay').textContent = username;
    loadLinks();
}

function logout() {
    token = null; username = null;
    localStorage.removeItem('sl_token');
    localStorage.removeItem('sl_username');
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('userInfo').style.display = 'none';
}

async function shortenUrl() {
    const url = document.getElementById('urlInput').value.trim();
    const alias = document.getElementById('aliasInput').value.trim();
    const err = document.getElementById('shortenError');
    err.textContent = '';
    if (!url) { err.textContent = 'Please enter a URL'; return; }

    try {
        const body = { originalUrl: url };
        if (alias) body.customAlias = alias;
        const res = await fetch(`${API}/api/v1/urls`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
            if (data.validationErrors) throw new Error(Object.values(data.validationErrors).join(', '));
            throw new Error(data.message || 'Failed to shorten URL');
        }
        // Show result
        const displayShortUrl = data.shortUrl.replace(/^http:\/\/localhost:8080/, API);
        document.getElementById('resultLink').href = displayShortUrl;
        document.getElementById('resultLink').textContent = displayShortUrl;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('urlInput').value = '';
        document.getElementById('aliasInput').value = '';
        showToast('Link created! 🎉');
        loadLinks();
    } catch (e) { err.textContent = e.message; }
}

function copyLink() {
    const link = document.getElementById('resultLink').textContent;
    navigator.clipboard.writeText(link);
    showToast('Copied to clipboard! ✅');
}

async function loadLinks() {
    try {
        const res = await fetch(`${API}/api/v1/urls`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        const data = await res.json();
        const list = document.getElementById('linksList');

        if (!data.content || data.content.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="icon">🔗</div><p>No links yet. Shorten your first URL above!</p></div>';
            return;
        }

        list.innerHTML = data.content.map(link => {
            const shortUrl = link.shortUrl.replace(/^http:\/\/localhost:8080/, API);
            return `
            <div class="link-card">
                <div class="link-top">
                    <a class="link-short" href="${shortUrl}" target="_blank">${shortUrl}</a>
                    <div class="link-clicks"><strong>${link.clickCount}</strong> clicks</div>
                </div>
                <div class="link-original">${link.originalUrl}</div>
            </div>
            `;
        }).join('');
    } catch (e) { console.error(e); }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}
</script>

</body>
</html>
